[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelguard"
version = "0.0.12"
description = "A comprehensive, production-ready LLM security and guardrails framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "SentinelGuard Contributors"},
    {name = "Anuj Tyagi"},
]
keywords = ["llm", "security", "guardrails", "ai", "safety", "pii", "adversarial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "tiktoken>=0.5.0",
    "regex>=2023.0",
    # Secrets detection
    "detect-secrets>=1.4.0",
    # PII detection (Presidio)
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.6.0",
]

[project.optional-dependencies]
models = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
]
gateway = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "redis>=5.0.0",
    "websockets>=12.0",
]
monitoring = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "prometheus-client>=0.17.0",
    "langfuse>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
sentinelguard = "sentinelguard.cli:main"

[project.urls]
Homepage = "https://github.com/aitechnav/Sentinel_Guard"
Repository = "https://github.com/aitechnav/Sentinel_Guard"
Issues = "https://github.com/aitechnav/Sentinel_Guard/issues"

[tool.setuptools.packages.find]
include = ["sentinelguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Keep CI focused on correctness rules for now. The wider Ruff rule groups
# below currently produce hundreds of legacy style findings across the package,
# so they should be enabled gradually in dedicated cleanup changes.
select = ["E", "F"]
ignore = ["BLE", "E501", "I", "PYI", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
