site_name: SentinelGuard
site_description: Security guardrails, LLM gateway controls, and observability for AI applications
site_url: https://aitechnav.github.io/Sentinel_Guard/
use_directory_urls: false
copyright: Copyright &copy; SentinelGuard Contributors

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/sentinelguard-logo.svg
  favicon: assets/images/sentinelguard-logo.svg
  features:
    - announce.dismiss
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Product: index.md
  - Docs:
      - Getting Started: getting-started.md
      - LLM Gateway:
          - Overview: gateway.md
          - Client Integrations: client-integrations.md
          - Stable API: gateway-api.md
          - Container Images: container-images.md
      - Security:
          - Scanners: scanners.md
          - Benchmarking: benchmarking.md
      - Deployment: deployment.md
      - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aitechnav/Sentinel_Guard
      name: SentinelGuard on GitHub

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
