apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelguard-gateway
  namespace: sentinelguard
  labels:
    app.kubernetes.io/name: sentinelguard-gateway
    app.kubernetes.io/component: llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelguard-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelguard-gateway
        app.kubernetes.io/component: llm-gateway
    spec:
      containers:
        - name: sentinelguard-gateway
          image: sentinelguard-gateway:local
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --gateway-config
            - /etc/sentinelguard/gateway.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: GOOGLE_API_KEY
                  optional: true
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: MOONSHOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: MOONSHOT_API_KEY
                  optional: true
            - name: KIMI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: KIMI_API_KEY
                  optional: true
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: MISTRAL_API_KEY
                  optional: true
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: MINIMAX_API_KEY
                  optional: true
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: HF_TOKEN
                  optional: true
            - name: SENTINELGUARD_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: SENTINELGUARD_GATEWAY_API_KEY
                  optional: true
            - name: SENTINELGUARD_AUDIT_SALT
              valueFrom:
                secretKeyRef:
                  name: sentinelguard-gateway-secrets
                  key: SENTINELGUARD_AUDIT_SALT
                  optional: true
          readinessProbe:
            httpGet:
              path: /gateway/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /gateway/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/sentinelguard/gateway.yaml
              subPath: gateway.yaml
              readOnly: true
            - name: huggingface-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: gateway-config
          configMap:
            name: sentinelguard-gateway-config
        - name: huggingface-cache
          emptyDir: {}
