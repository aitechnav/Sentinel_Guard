apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelguard-gateway-config
  namespace: sentinelguard
  labels:
    app.kubernetes.io/name: sentinelguard-gateway
data:
  gateway.yaml: |
    gateway:
      enabled: true
      provider: openai
      upstream_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      client_api_key_env: SENTINELGUARD_GATEWAY_API_KEY
      forward_authorization: true
      block_on_prompt_fail: true
      block_on_output_fail: true
      sanitize: true
      redact_pii: true
      redact_output_pii: true
      route_pii_to_private_provider: false
      fallback_enabled: true
      failover_status_codes:
        - 408
        - 409
        - 425
        - 429
        - 500
        - 502
        - 503
        - 504
      timeout_seconds: 60
      default_max_tokens: 1024
      streaming_mode: buffered
      state_backend: sqlite
      state_path: /data/sentinelguard_gateway.sqlite3
      admin_ui_enabled: true
      admin_auth_enabled: true
      admin_state_path: /data/sentinelguard_gateway.sqlite3
      admin_username_env: SENTINELGUARD_ADMIN_USERNAME
      admin_password_env: SENTINELGUARD_ADMIN_PASSWORD
      admin_viewer_username_env: SENTINELGUARD_VIEWER_USERNAME
      admin_viewer_password_env: SENTINELGUARD_VIEWER_PASSWORD
      metrics_enabled: true
      audit_enabled: true
      audit_hash_salt_env: SENTINELGUARD_AUDIT_SALT
      providers:
        - name: primary-openai
          provider: openai
          upstream_url: https://api.openai.com/v1
          api_key_env: OPENAI_API_KEY
          private: false
          priority: 10
          weight: 1
