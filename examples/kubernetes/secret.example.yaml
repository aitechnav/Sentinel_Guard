apiVersion: v1
kind: Secret
metadata:
  name: sentinelguard-gateway-secrets
  namespace: sentinelguard
  labels:
    app.kubernetes.io/name: sentinelguard-gateway
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-with-openai-key"
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  MOONSHOT_API_KEY: ""
  KIMI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  MISTRAL_API_KEY: ""
  MINIMAX_API_KEY: ""
  HF_TOKEN: ""
  SENTINELGUARD_GATEWAY_API_KEY: "generate-with-sentinelguard-token"
  SENTINELGUARD_AUDIT_SALT: "generate-with-sentinelguard-token-prefix-sgaudit"
  SENTINELGUARD_ADMIN_USERNAME: "admin"
  SENTINELGUARD_ADMIN_PASSWORD: "generate-with-sentinelguard-token-prefix-sgadmin"
  SENTINELGUARD_VIEWER_USERNAME: "viewer"
  SENTINELGUARD_VIEWER_PASSWORD: "generate-with-sentinelguard-token-prefix-sgviewer"
