apiVersion: v1
kind: Secret
metadata:
  name: sentinelguard-gateway-secrets
  namespace: sentinelguard
  labels:
    app.kubernetes.io/name: sentinelguard-gateway
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-with-openai-key"
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  MISTRAL_API_KEY: ""
  MINIMAX_API_KEY: ""
  HF_TOKEN: ""
  SENTINELGUARD_GATEWAY_API_KEY: "replace-with-gateway-client-token"
  SENTINELGUARD_AUDIT_SALT: "replace-with-random-audit-salt"
