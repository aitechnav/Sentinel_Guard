replicaCount: 1

image:
  repository: sentinelguard-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# The built-in dashboard token store uses SQLite by default, so the
# starter chart runs as one replica. Use config-managed keys or a shared
# admin-state backend before enabling autoscaling.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  MOONSHOT_API_KEY: ""
  KIMI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  MISTRAL_API_KEY: ""
  MINIMAX_API_KEY: ""
  HF_TOKEN: ""
  HUGGINGFACE_API_KEY: ""
  OLLAMA_API_KEY: ""
  # Generate with: sentinelguard token
  SENTINELGUARD_GATEWAY_API_KEY: ""
  # Generate with: sentinelguard token --prefix sgaudit
  SENTINELGUARD_AUDIT_SALT: ""
  SENTINELGUARD_ADMIN_USERNAME: "admin"
  SENTINELGUARD_ADMIN_PASSWORD: ""
  SENTINELGUARD_VIEWER_USERNAME: "viewer"
  SENTINELGUARD_VIEWER_PASSWORD: ""

gatewayConfig: |
  gateway:
    enabled: true
    provider: openai
    api_key_env: OPENAI_API_KEY
    client_api_key_env: SENTINELGUARD_GATEWAY_API_KEY
    routing_strategy: priority
    state_backend: sqlite
    state_path: /data/sentinelguard_gateway.sqlite3
    cache_enabled: true
    cache_backend: sqlite
    cache_ttl_seconds: 300
    admin_ui_enabled: true
    admin_auth_enabled: true
    admin_state_path: /data/sentinelguard_gateway.sqlite3
    admin_username_env: SENTINELGUARD_ADMIN_USERNAME
    admin_password_env: SENTINELGUARD_ADMIN_PASSWORD
    admin_viewer_username_env: SENTINELGUARD_VIEWER_USERNAME
    admin_viewer_password_env: SENTINELGUARD_VIEWER_PASSWORD
    metrics_enabled: true
    audit_enabled: true
    providers:
      - name: openai-fast
        provider: openai
        model_name: fast-chat
        upstream_model: gpt-4o-mini
        api_key_env: OPENAI_API_KEY
        priority: 10
        weight: 1

persistence:
  enabled: true
  size: 5Gi
  mountPath: /data
