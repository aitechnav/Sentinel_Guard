apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinelguard.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "sentinelguard.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sentinelguard.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sentinelguard.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - gateway
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --gateway-config
            - /etc/sentinelguard/gateway.yaml
          envFrom:
            - secretRef:
                name: {{ include "sentinelguard.fullname" . }}-env
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/sentinelguard
              readOnly: true
{{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "sentinelguard.fullname" . }}-config
{{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sentinelguard.fullname" . }}-data
{{- end }}
